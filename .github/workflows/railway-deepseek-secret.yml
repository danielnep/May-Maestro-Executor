name: Horizon - transferir DeepSeek ao Railway
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/railway-deepseek-secret.yml'
permissions:
  contents: read
jobs:
  provision:
    if: github.repository == 'danielnep/May-Maestro-Executor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Instalar segredo existente no serviço Horizon, sem publicar valor
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          secret=os.getenv('DEEPSEEK_API_KEY','')
          token=os.getenv('RAILWAY_API_TOKEN','')
          if not secret or not token:
              print('::error::Missing existing DeepSeek or Railway Actions secret; not provisioned')
              raise SystemExit(1)
          query='mutation variableUpsert($input: VariableUpsertInput!){variableUpsert(input:$input)}'
          variables={'input':{
            'projectId':'caf3c2ea-f857-4242-8fa3-5453ea1462ca',
            'environmentId':'6c3d13e1-d963-49c0-8121-8c75bd172766',
            'serviceId':'b0a2cd36-3694-4bea-ab22-716ead95fe4c',
            'name':'DEEPSEEK_API_KEY',
            'value':secret}}
          request=Request('https://backboard.railway.app/graphql/v2',
              method='POST',data=json.dumps({'query':query,'variables':variables}).encode(),
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json',
                       'User-Agent':'Horizon-Authorized-Secret-Provisioner'})
          try:
              with urlopen(request,timeout=35) as res:
                  body=json.load(res)
          except HTTPError as error:
              print('::error::Railway API rejected secret provisioning HTTP '+str(error.code))
              raise SystemExit(1)
          except (URLError,TimeoutError,OSError,ValueError):
              print('::error::Railway API secret provisioning transport error')
              raise SystemExit(1)
          if body.get('errors') or body.get('data',{}).get('variableUpsert') is not True:
              print('::error::Railway refused variable upsert; credentials NOT copied')
              raise SystemExit(1)
          print('DeepSeek secret installed in existing Horizon Site Railway service (value withheld)')
          PY
