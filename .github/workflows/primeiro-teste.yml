name: May Maestro - Teste do Chrome

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/primeiro-teste.yml'
      - 'GEMINI.md'

permissions:
  contents: read

jobs:
  auditar-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v4

      - name: Verificar chave do Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'ERRO: GEMINI_API_KEY ausente. Configure em Settings > Secrets and variables > Actions.'
            exit 1
          fi
          echo 'Chave encontrada no ambiente (valor oculto).'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true

      - name: Instalar Gemini CLI e extensao oficial do Chrome
        run: |
          npm install -g @google/gemini-cli
          gemini --version
          gemini extensions install --consent --auto-update https://github.com/ChromeDevTools/chrome-devtools-mcp
          gemini extensions list

      - name: Configurar Chrome DevTools MCP em modo headless
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const config = path.join(process.env.HOME, '.gemini', 'extensions', 'chrome-devtools-mcp', 'gemini-extension.json');
          if (!fs.existsSync(config)) throw new Error('Extensao nao encontrada: ' + config);
          const ext = JSON.parse(fs.readFileSync(config, 'utf8'));
          const server = ext.mcpServers?.['chrome-devtools'];
          if (!server || !Array.isArray(server.args)) throw new Error('Configuracao MCP ausente');
          server.args = server.args.filter(arg => !/^--(headless|isolated|executable-path|executablePath|chrome-arg)/.test(arg));
          server.args.push('--headless', '--isolated', '--executable-path=' + process.env.CHROME_BIN, '--chrome-arg', '--no-sandbox', '--log-file=/tmp/chrome-devtools-mcp.log');
          fs.writeFileSync(config, JSON.stringify(ext, null, 2) + '\n');
          console.log('Chrome DevTools configurado para execucao sem interface.');
          NODE

      - name: Testar Chrome MCP diretamente sem IA
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p evidencias
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.HOME, '.gemini', 'extensions', 'chrome-devtools-mcp', 'gemini-extension.json');
          const ext = JSON.parse(fs.readFileSync(file, 'utf8'));
          fs.writeFileSync('.mcp-smoke.json', JSON.stringify({mcpServers: {'chrome-devtools': ext.mcpServers['chrome-devtools']}}, null, 2));
          NODE
          timeout 90s npx -y @modelcontextprotocol/inspector --cli --config .mcp-smoke.json --server chrome-devtools --method tools/call --tool-name list_pages --format json > evidencias/chrome-mcp.json
          echo 'Chrome DevTools MCP testado independentemente da IA.'

      - name: Testar Gemini e Chrome DevTools MCP
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: 'true'
        run: |
          mkdir -p evidencias
          gemini mcp list
          timeout 150s gemini --model gemini-3.5-flash-lite -p 'Use somente as ferramentas Chrome DevTools MCP para abrir https://horizonsolucoes.com e verificar a tela mobile 390x844. Diga objetivamente se o navegador abriu e relate erros observados. Se o MCP falhar, informe o erro e encerre; nao use shell nem web_fetch como alternativa.' --approval-mode=yolo --output-format=json > evidencias/relatorio.json
          echo 'Auditoria concluida. Relatorio salvo.'

      - name: Capturar screenshot mobile independente
        if: always()
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p evidencias
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --no-first-run --hide-scrollbars --window-size=390,844 --virtual-time-budget=5000 --screenshot=evidencias/horizon-mobile.png https://horizonsolucoes.com >/dev/null 2>&1 || echo 'Screenshot indisponivel; verificar logs.'

      - name: Publicar evidencias no GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidencias
          path: evidencias/
          if-no-files-found: warn
          retention-days: 7
