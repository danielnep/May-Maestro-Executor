name: Horizon VPS encrypted state handoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vps-handoff-20261022.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encrypt-existing-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Wrap the existing SQLite checkpoint to VPS public key
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HORIZON_SQLITE_ENCRYPTION_KEY: ${{ secrets.HORIZON_SQLITE_ENCRYPTION_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, sqlite3, tempfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from horizon_core.github_sqlite_state import GitHubSQLiteState
          public_pem = "-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwGvMe3DquapuO1u4dRUa\nqxCe4VA5WDBWqUfT3EfGkS2aW1q0St0JS//nIkUlxN27d2wUmHOS70Tbb7gEkdQY\nRCRBAXUpp2FVJcD3Wmbb3x8oGPijHKhwfTLEUUpb7ZNevTsThSZb1tnrKtxU4/IL\nnrw5PxYg3HrrM8egDOC/zYwrcRRJdjcgePw7HOCca4sgkTAoSzvGdRSFeL4r1dgw\nxi4aBn2wKC6f+kmCVvs7RaV7tCaPEIfKaGMYhy4mPkW/LCGEw7nd2/KKOh5+upH8\n8sMHvIqd33vCmGNCHXBXZzPuB3yTw9zBJFSZ2VGUTD9fgrFI0S8amchhPjVO2OV5\nO9eNkkoQDWpRRfBJQ+HA7yQtMEVQ5x3zr2W5kQ95AKMMH25q4HqXSj1vIzEtEPWR\nIALeyO39q3nPjm7IsNduAun3WFZB3d3R4DwetP9qexoohehHcWLkSUKQ6gN6cTrg\ntbVU/HsVabJME4wce4qndZpB1KsQc9PCbRbC5LXsbVvPAgMBAAE=\n-----END PUBLIC KEY-----"
          source = GitHubSQLiteState()
          source_sha = source.remote.sha
          if not source_sha:
              raise RuntimeError("Existing checkpoint SHA absent; cannot migrate")
          with tempfile.TemporaryDirectory() as td:
              target = Path(td) / "snapshot.sqlite3"
              with sqlite3.connect(target) as destination:
                  source.db.backup(destination)
                  if destination.execute("PRAGMA quick_check").fetchone()[0] != "ok":
                      raise RuntimeError("SQLite checkpoint integrity failure")
              state = target.read_bytes()
          source.close()
          if not state.startswith(b"SQLite format 3\\x00"):
              raise RuntimeError("Invalid state header")
          key, nonce = os.urandom(32), os.urandom(12)
          aad = b"horizon-vps-maestro-state-v1"
          compressed = gzip.compress(state, compresslevel=6, mtime=0)
          encrypted = AESGCM(key).encrypt(nonce, compressed, aad)
          public_key = serialization.load_pem_public_key(public_pem.encode())
          wrapped = public_key.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          package = {"version":1,"source_sha":source_sha,"db_sha256":hashlib.sha256(state).hexdigest(),
                     "nonce":base64.b64encode(nonce).decode(),"wrapped_key":base64.b64encode(wrapped).decode(),
                     "ciphertext":base64.b64encode(encrypted).decode()}
          raw = (json.dumps(package,sort_keys=True,separators=(",",":"))+"\\n").encode()
          repo=os.environ["GITHUB_REPOSITORY"]
          path="runtime/horizon-vps-handoff-20261022.enc.json"
          url="https://api.github.com/repos/"+repo+"/contents/"+path
          header={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28","User-Agent":"Horizon-VPS-One-Time-Handoff"}
          previous=None
          try:
              with urlopen(Request(url+"?ref=main",headers=header),timeout=25) as response:
                  previous=json.load(response).get("sha")
          except HTTPError as error:
              if error.code != 404:
                  raise
          body={"message":"chore(vps): encrypted checkpoint handoff [skip ci]","branch":"main",
                "content":base64.b64encode(raw).decode()}
          if previous:
              body["sha"]=previous
          request=Request(url,data=json.dumps(body).encode(),headers={**header,"Content-Type":"application/json"},method="PUT")
          with urlopen(request,timeout=90) as response:
              if response.status not in (200,201):
                  raise RuntimeError("Encrypted transfer failed")
          print(json.dumps({"status":"encrypted_checkpoint_published","source_sha":source_sha,
                            "file_bytes":len(raw),"db_sha256":package["db_sha256"]}))
          PY
