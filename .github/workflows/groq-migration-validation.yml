name: Horizon - Groq Migration Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'horizon_core/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements-postgres.txt'
      - 'requirements-knowledge.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: groq-migration-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dry-run:
    name: Testar contrato Groq sem usar APIs ou chaves
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe e importações
        run: python -m compileall -q horizon_core tests
      - name: Testes offline da migração
        run: |
          python -m unittest discover -s tests -p test_groq_minute_budget.py -v
          python -m unittest discover -s tests -p test_gateway.py -v
          python -m unittest discover -s tests -p test_app.py -v
          python -m unittest discover -s tests -p test_worker.py -v
          python -m unittest discover -s tests -p test_provider_access_probe.py -v
          python -m unittest discover -s tests -p test_gemini_model_pin.py -v
      - name: Gate contra API paga ou comunicação externa nos testes
        run: |
          python - <<'PY'
          from pathlib import Path
          core = (Path('horizon_core')/'gateway.py').read_text()
          worker = (Path('horizon_core')/'worker.py').read_text()
          registry = (Path('horizon_core')/'registry.py').read_text()
          assert 'api.deepseek.com' not in core
          assert 'request_consultation(' not in worker
          assert 'direct_chat.execute(' not in worker
          assert 'config["tools"] = [tool for tool in config["tools"] if tool != "consult_may"]' in registry
          print('Gate de isolamento e fallback verificado.')
          PY
  broad-regression:
    name: Regressão integrada dos 17 agentes (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: horizon_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: horizon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U horizon_test -d horizon_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_TEST_DSN: postgresql://horizon_test:synthetic-ci-only@localhost:5432/horizon_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de teste
        run: pip install -r requirements-postgres.txt -r requirements-knowledge.txt cryptography==46.0.3
      - name: SDK de sandbox sem inferência
        working-directory: sandbox
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Executar suíte de integração
        run: python -m unittest discover -s tests -v
      - name: Verificar bridge JavaScript
        working-directory: sandbox
        run: node --test bridge.test.mjs postgres_bridge.test.mjs
