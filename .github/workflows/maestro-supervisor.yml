name: May Maestro - Testes do Supervisor

# Revisao proativa dos projetos pertence a May, via tarefa agendada no ChatGPT.
# Gemini nao executa auditoria periodica nem recebe autonomia de desenvolvimento.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supervisor.py'
      - '.github/workflows/maestro-supervisor.yml'

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Testar codigo legado do supervisor (sem acesso a rede/IA)
        run: python3 supervisor.py --self-test
