name: Diagnostico seguro Groq (segredos)
on:
  push:
    branches:
      - feat/agents-groq-github-20261020
    paths:
      - .github/workflows/groq-secret-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SEC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SEC_API_IA_GROQ: ${{ secrets.API_IA_GROQ }}
      SEC_GROQ_KEY: ${{ secrets.GROQ_KEY }}
      SEC_GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
      SEC_GROQ_API_TOKEN: ${{ secrets.GROQ_API_TOKEN }}
      SEC_API_GROQ: ${{ secrets.API_GROQ }}
      SEC_GROQ_APIKEY: ${{ secrets.GROQ_APIKEY }}
      SEC_GROQ_AI_API_KEY: ${{ secrets.GROQ_AI_API_KEY }}
      SEC_GROQ_API_KEY_HORIZON: ${{ secrets.GROQ_API_KEY_HORIZON }}
      SEC_GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      SEC_POWER_BI_MICHELLE_IA: ${{ secrets.POWER_BI_MICHELLE_IA }}
      VAR_GROQ_API_KEY: ${{ vars.GROQ_API_KEY }}
      VAR_API_IA_GROQ: ${{ vars.API_IA_GROQ }}
      VAR_GROQ_KEY: ${{ vars.GROQ_KEY }}
      VAR_GROQ_TOKEN: ${{ vars.GROQ_TOKEN }}
      VAR_GROQ_API_TOKEN: ${{ vars.GROQ_API_TOKEN }}
      VAR_API_GROQ: ${{ vars.API_GROQ }}
      VAR_GROQ_APIKEY: ${{ vars.GROQ_APIKEY }}
      VAR_GROQ_AI_API_KEY: ${{ vars.GROQ_AI_API_KEY }}
      VAR_GROQ_API_KEY_HORIZON: ${{ vars.GROQ_API_KEY_HORIZON }}
      VAR_GROK_API_KEY: ${{ vars.GROK_API_KEY }}
      VAR_POWER_BI_MICHELLE_IA: ${{ vars.POWER_BI_MICHELLE_IA }}
    steps:
      - name: Verificar escopo do segredo sem exibir valores
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          names=["GROQ_API_KEY","API_IA_GROQ","GROQ_KEY","GROQ_TOKEN","GROQ_API_TOKEN","API_GROQ","GROQ_APIKEY","GROQ_AI_API_KEY","GROQ_API_KEY_HORIZON","GROK_API_KEY","POWER_BI_MICHELLE_IA"]
          # Nomes nao sao segredos. Valores nunca sao impressos.
          present=[n for n in names if os.environ.get("SEC_"+n)]
          public_vars=[n for n in names if os.environ.get("VAR_"+n)]
          print("SECRETS_ENCONTRADOS="+(",".join(present) if present else "NENHUM"))
          print("VARIABLES_PUBLICAS_ENCONTRADAS="+(",".join(public_vars) if public_vars else "NENHUMA"))
          key=next((os.environ.get("SEC_"+n) for n in ("GROQ_API_KEY","API_IA_GROQ","GROQ_KEY","GROQ_TOKEN","GROQ_API_TOKEN","API_GROQ","GROQ_APIKEY","GROQ_AI_API_KEY","GROQ_API_KEY_HORIZON") if os.environ.get("SEC_"+n)),None)
          if not key:
              print("GROQ_AUTH=NAO_TESTADO_SEM_SECRET")
              raise SystemExit(0)
          req=urllib.request.Request("https://api.groq.com/openai/v1/models",headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  payload=json.load(response)
              ids={m.get("id") for m in payload.get("data",[]) if isinstance(m,dict)}
              print("GROQ_AUTH=HTTP_200")
              print("MODELOS_LISTADOS="+str(len(ids)))
              print("GPT_OSS_120B="+("DISPONIVEL" if "openai/gpt-oss-120b" in ids else "NAO_LISTADO"))
              print("LLAMA_3_3_70B="+("DISPONIVEL" if "llama-3.3-70b-versatile" in ids else "NAO_LISTADO"))
          except urllib.error.HTTPError as e:
              import re
              print("GROQ_AUTH=HTTP_"+str(e.code))
              data=e.read(4096).decode("utf-8","replace")
              try:
                  err=json.loads(data)
              except ValueError:
                  err=None
              print("ERROR_FORMAT="+("json" if isinstance(err,dict) else "html" if "<html" in data.lower() else "text"))
              error=(err or {}).get("error",{}) if isinstance(err,dict) else {}
              if not isinstance(error,dict):error={}
              for field in ("type","code"):
                  val=error.get(field)
                  if isinstance(val,str) and re.fullmatch("[a-zA-Z0-9_.-]{1,70}",val):
                      print("GROQ_ERROR_"+field.upper()+"="+val)
              known={
                  "invalid_key":("invalid_api_key","invalid api key","invalid authentication","invalid token"),
                  "permission":("permission denied","not authorized","not permitted","forbidden"),
                  "organization":("organization","organisation","org_"),
                  "ip_restricted":("ip address","ip restricted","location blocked"),
                  "cloudflare":("cloudflare","attention required","access denied"),
                  "rate_limited":("rate limit","too many requests"),
                  "billing":("billing","payment required")}
              body=data.lower()
              print("ERROR_INDICATORS="+(",".join(k for k,v in known.items() if any(i in body for i in v)) or "none"))
              print("KEY_PREFIX_EXPECTED="+str(key.startswith("gsk_")))
              print("KEY_OUTER_WHITESPACE="+str(key!=key.strip()))
              print("KEY_HAS_BEARER_PREFIX="+str(key.lower().startswith("bearer ")))
              # Compare with the same endpoint without any key to detect perimeter blocks.
              public=urllib.request.Request("https://api.groq.com/openai/v1/models",headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(public,timeout=20) as response:
                      baseline_status=response.status
                      baseline_body=response.read(4096).decode("utf-8","replace")
              except urllib.error.HTTPError as noauth:
                  baseline_status=noauth.code
                  baseline_body=noauth.read(4096).decode("utf-8","replace")
              except Exception as noauth:
                  baseline_status=0
                  baseline_body=""
              print("NOAUTH_STATUS="+str(baseline_status))
              print("NOAUTH_CLOUDFLARE_MARKER="+str("cloudflare" in baseline_body.lower()))
          except Exception as e:
              print("GROQ_AUTH=TRANSPORTE_"+type(e).__name__)
          PY
