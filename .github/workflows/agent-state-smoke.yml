name: Horizon - prova de banco dos agentes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-state-smoke.yml'
      - 'horizon_core/embedded_state.py'
permissions:
  contents: read
  id-token: write
jobs:
  state-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar conexão OIDC e armazenamento Horizon, somente leitura
        run: |
          python - <<'PY'
          from horizon_core.embedded_state import HorizonEmbeddedState
          client=HorizonEmbeddedState.__new__(HorizonEmbeddedState)
          client.requester=__import__('urllib.request',fromlist=['urlopen']).urlopen
          client.token=client._oidc_token()
          import base64, json
          claims=json.loads(base64.urlsafe_b64decode(client.token.split('.')[1]+'==='))
          print('OIDC claims:',{key:claims.get(key) for key in ('iss','repository','ref','workflow_ref','sub','aud','iat','nbf','exp')})
          try:
              value=client._request('GET')
          except Exception:
              from urllib.request import Request
              from urllib.error import HTTPError,URLError
              request=Request('https://horizonsolucoes.com/api/internal/horizon-agent-state',
                headers={'Authorization':'Bearer '+client.token,'User-Agent':'Horizon-State-Probe'})
              try:
                  with client.requester(request,timeout=15) as response: print('Probe status:',response.status)
              except HTTPError as error: print('Probe HTTP:',error.code)
              except URLError: print('Probe network error')
              raise
          assert type(value.get('revision')) is int
          print('Horizon embedded PostgreSQL: authenticated read succeeded; revision available')
          PY
