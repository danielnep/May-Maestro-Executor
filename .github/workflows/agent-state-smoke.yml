name: Horizon - prova do SQLite ativo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-state-smoke.yml'
      - 'horizon_core/github_sqlite_state.py'
permissions:
  contents: read
jobs:
  state-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated state dependencies
        run: python -m pip install 'cryptography>=43,<48' --quiet
      - name: Verify active GitHub SQLite checkpoint without printing data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HORIZON_SQLITE_ENCRYPTION_KEY: ${{ secrets.HORIZON_SQLITE_ENCRYPTION_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from horizon_core.github_sqlite_state import GitHubSQLiteState
          with_state=GitHubSQLiteState()
          try:
              result=with_state.db.execute('PRAGMA quick_check').fetchone()[0]
              if result!='ok':raise RuntimeError('SQLite integrity failed')
              counts={table:with_state.db.execute('SELECT count(*) FROM '+table).fetchone()[0]
                      for table in ('tasks','events','memory')}
              print(json.dumps({'active_backend':'github-encrypted-sqlite',
                  'branch':'agent-state/runtime','integrity':'ok','counts':counts,
                  'legacy_restored_automatically':with_state.restored_legacy}))
          finally:
              with_state.close()
          PY
