name: Horizon - pedidos do chat por commit

on:
  push:
    branches: [main]
    paths:
      - 'tasks/chat/*.json'
      - '.github/workflows/chat-requests.yml'
      - 'horizon_core/commit_bridge.py'
      - 'horizon_core/pages_preview.py'
      - 'tests/test_pages_preview.py'
      - 'horizon_core/state.py'
      - 'horizon_core/gateway.py'
      - 'tests/test_gateway.py'
      - 'tests/test_provider_recovery.py'
      - 'horizon_core/embedded_state.py'
      - 'horizon_core/github_sqlite_state.py'
      - 'horizon_core/github_state.py'
      - 'horizon_core/worker.py'
      - 'horizon_core/context_budget.py'
      - 'horizon_core/verified_repairs.py'
      - 'tests/test_verified_repairs.py'
      - 'tests/test_agent_budgets.py'
      - 'horizon_core/tools.py'
      - 'horizon_core/state.py'
      - 'horizon_core/registry.py'
      - 'horizon_core/learning.py'
      - 'horizon_core/knowledge_sync.py'
      - 'tests/test_knowledge_sync.py'
      - 'tests/test_shared_incident_playbook.py'
      - 'agents/knowledge/verified-error-playbook.json'
      - 'horizon_core/deterministic.py'
      - 'tests/test_agent_learning.py'
      - 'horizon_core/provider_access_probe.py'
      - 'tests/test_provider_access_probe.py'
      - 'horizon_core/web_checks.py'
      - 'horizon_core/visual_contract.py'
      - 'horizon_core/ui_imagination.py'
      - 'tests/test_ui_imagination.py'
      - 'tests/test_visual_contract.py'
      - 'synthetic_visual/browser-proof.cjs'
      - 'synthetic_visual/generic-demo/**'
      - 'agents/ui-ux-designer/tools.json'
      - 'agents/horizon-ui-guardian/tools.json'
      - 'tests/test_github_sqlite_state.py'
      - 'tests/test_github_state.py'
      - 'agents/knowledge/delivery-principles.md'
      - 'agents/may-maestro/instructions.md'
  workflow_dispatch:
  schedule:
    # Retomar checkpoints a cada 5 min; novos pedidos disparam via push imediatamente.
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: horizon-durable-worker
  cancel-in-progress: false

jobs:
  process-chat-requests:
    if: github.repository == 'danielnep/May-Maestro-Executor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar biblioteca oficial Railway (sem CLI)
        working-directory: sandbox
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar criptografia auditada para checkpoints SQLite
        run: python -m pip install cryptography==46.0.3
      - name: Validar contrato do controlador sem chamadas externas
        run: |
          python -m unittest discover -s tests -p test_commit_bridge.py -v
          python -m unittest discover -s tests -p test_handoff.py -v
          python -m unittest discover -s tests -p test_handoff_workflow.py -v
          python -m unittest discover -s tests -p test_provider_recovery.py -v
          python -m unittest discover -s tests -p test_gateway.py -v
          python -m unittest discover -s tests -p test_worker.py -v
          python -m unittest discover -s tests -p test_web_checks.py -v
          python -m unittest discover -s tests -p test_visual_contract.py -v
          python -m unittest discover -s tests -p test_ui_imagination.py -v
          python -m unittest discover -s tests -p test_ui_runtime.py -v
          python -m unittest discover -s tests -p test_state.py -v
          python -m unittest discover -s tests -p test_tools.py -v
          python -m unittest discover -s tests -p test_agent_budgets.py -v
          python -m unittest discover -s tests -p test_verified_repairs.py -v
          python -m unittest discover -s tests -p test_github_state.py -v
          python -m unittest discover -s tests -p test_github_sqlite_state.py -v
          python -m unittest discover -s tests -p test_agent_learning.py -v
          python -m unittest discover -s tests -p test_shared_incident_playbook.py -v
          python -m unittest discover -s tests -p test_knowledge_sync.py -v
          python -m unittest discover -s tests -p test_gemini_model_pin.py -v
          python -m unittest discover -s tests -p test_provider_access_probe.py -v
          python -m unittest discover -s tests -p test_agent_report_quality.py -v
          python -m unittest discover -s tests -p test_pages_preview.py -v
      - name: Validar scripts isolados Node
        run: |
          node --check synthetic_visual/node-proof.cjs
          node --check synthetic_visual/browser-proof.cjs
      - name: Preparar imagem isolada para testes Node e Playwright
        # A imagem e local a cada runner; sem esse build, Docker retorna exit 125.
        run: docker build -t horizon-web-proof:1.58.2 synthetic_visual
      - name: Importar pedidos, retomar especialistas e registrar resultados
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          # Explicit owner attestation received 2026-10-19; NOT a billing API proof.
          GEMINI_FREE_TIER_CONFIRMED: 'true'
          GEMINI_FREE_FALLBACK_MODEL: gemini-3.5-flash-lite
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          HORIZON_STATE_BACKEND: github-sqlite
          HORIZON_SQLITE_ENCRYPTION_KEY: ${{ secrets.HORIZON_SQLITE_ENCRYPTION_KEY }}
          HORIZON_PAGES_TOKEN: ${{ secrets.HORIZON_PAGES_TOKEN }}
        run: python -m horizon_core.commit_bridge --session-seconds 1200
      - name: Publicar aprendizados verificados no GitHub com verificacao de integridade
        # O checkpoint privado permanece criptografado em agent-state/runtime.
        # So metadados permitidos e validados sao copiados para o manual publico.
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HORIZON_SQLITE_ENCRYPTION_KEY: ${{ secrets.HORIZON_SQLITE_ENCRYPTION_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: python -m horizon_core.knowledge_sync
      - name: Compartilhar prints dos agentes quando expressamente autorizado
        if: ${{ always() && vars.HORIZON_VISUAL_ARTIFACTS_PUBLIC_SAFE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: horizon-agent-ui-evidence
          path: runtime/web-evidence/
          if-no-files-found: ignore
          retention-days: 3
      - name: Continuar imediatamente quando o checkpoint estiver pronto
        # O controlador pode registrar tarefas prontas e retornar erro por pedidos rejeitados.
        # Nao disparar em cancelamento; handoff.py exige marcador resume=true.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: python -m horizon_core.handoff --dispatch
      - name: Registrar incidente quando o controlador falhar
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = os.environ["REPOSITORY"]
          run = os.environ["RUN_ID"]
          title = "Horizon: falha no controlador de agentes"
          api = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "Horizon-Agent-Monitor"}
          def request(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              q = Request(api + path, data=body, method=method, headers=headers)
              with urlopen(q, timeout=20) as response:
                  return json.load(response)
          try:
              issues = request("GET", "/issues?state=open&per_page=100")
              existing = next((i for i in issues if i.get("title") == title and "pull_request" not in i), None)
              message = "Falha detectada em https://github.com/" + repo + "/actions/runs/" + run
              if existing:
                  request("POST", "/issues/" + str(existing["number"]) + "/comments",
                          {"body": message})
              else:
                  request("POST", "/issues", {"title": title, "assignees": ["danielnep"], "body": message +
                          "\\n\\nInvestigar a causa antes de marcar como resolvido."})
              print("Incident recorded in GitHub Issues")
          except (HTTPError, OSError, ValueError) as error:
              print("::error::Unable to publish incident; workflow itself remains failed")
              raise SystemExit(1)
          PY
