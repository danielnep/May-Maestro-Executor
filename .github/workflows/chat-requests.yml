name: Horizon - pedidos do chat por commit

on:
  push:
    branches: [main]
    paths:
      - 'tasks/chat/*.json'
      - '.github/workflows/chat-requests.yml'
      - 'horizon_core/commit_bridge.py'
  workflow_dispatch:
  schedule:
    # Retomar checkpoints a cada 5 min; novos pedidos disparam via push imediatamente.
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: horizon-durable-worker
  cancel-in-progress: false

jobs:
  process-chat-requests:
    if: github.repository == 'danielnep/May-Maestro-Executor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar biblioteca oficial Railway (sem CLI)
        working-directory: sandbox
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validar contrato do controlador sem chamadas externas
        run: python -m unittest discover -s tests -p test_commit_bridge.py -v
      - name: Importar pedidos, retomar especialistas e registrar resultados
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          HORIZON_STATE_BACKEND: embedded-postgres
        run: python -m horizon_core.commit_bridge --session-seconds 2400
      - name: Continuar imediatamente quando o checkpoint estiver pronto
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: python -m horizon_core.handoff --dispatch
      - name: Registrar incidente quando o controlador falhar
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo = os.environ["REPOSITORY"]
          run = os.environ["RUN_ID"]
          title = "Horizon: falha no controlador de agentes"
          api = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "Horizon-Agent-Monitor"}
          def request(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              q = Request(api + path, data=body, method=method, headers=headers)
              with urlopen(q, timeout=20) as response:
                  return json.load(response)
          try:
              issues = request("GET", "/issues?state=open&per_page=100")
              existing = next((i for i in issues if i.get("title") == title and "pull_request" not in i), None)
              message = "Falha detectada em https://github.com/" + repo + "/actions/runs/" + run
              if existing:
                  request("POST", "/issues/" + str(existing["number"]) + "/comments",
                          {"body": message})
              else:
                  request("POST", "/issues", {"title": title, "assignees": ["danielnep"], "body": message +
                          "\\n\\nInvestigar a causa antes de marcar como resolvido."})
              print("Incident recorded in GitHub Issues")
          except (HTTPError, OSError, ValueError) as error:
              print("::error::Unable to publish incident; workflow itself remains failed")
              raise SystemExit(1)
          PY
