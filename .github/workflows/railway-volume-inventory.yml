name: Horizon | Inventario seguro do volume Railway
on:
  push:
    paths:
      - '.github/workflows/railway-volume-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official Railway CLI
        run: npm install -g @railway/cli@5.69.0 --no-audit --no-fund
      - name: Inventory Railway volume without printing contents or unknown names
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::RAILWAY_API_TOKEN not configured"; exit 1
          fi
          set +e
          railway volume files --volume a7c1051d-cc63-4172-aa49-cb02db589d29 list / --json > /tmp/volume.json 2>/tmp/volume.err
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/volume.err').read_text(errors='replace').lower()
          reason='authentication' if 'auth' in s or 'login' in s or 'token' in s else ('ssh_key' if 'ssh' in s or 'key' in s else ('volume' if 'volume' in s else 'other'))
          print('Inventory failed: '+reason)
          import re
          safe=re.sub(r'(https?://\\S+|[A-Za-z0-9_./=-]{28,})','[redacted]',s)
          print('Diagnostic:',safe[:350])
          PY
            exit "$CODE"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/volume.json').read_text()
          obj=json.loads(raw)
          print('Railway volume root JSON type:',type(obj).__name__)
          if isinstance(obj,dict):
              print('Keys:',','.join(sorted(obj.keys())))
              items=next((v for k,v in obj.items() if k in ('items','entries','files') and isinstance(v,list)),[])
          elif isinstance(obj,list):items=obj
          else:items=[]
          print('Root entry count:',len(items))
          known=('horizon-agents-postgres','maestro-supervisor-handoffs.json')
          for e in items:
              if not isinstance(e,dict):continue
              name=str(e.get('name') or e.get('path') or '')
              safe=next((k for k in known if name.strip('/').split('/')[-1]==k),None)
              size=e.get('size') or e.get('sizeBytes') or e.get('bytes')
              typ=e.get('type') or ('dir' if e.get('isDirectory') else 'unknown')
              print(json.dumps({'name':safe or '[other-redacted]','type':typ,'size':size},ensure_ascii=False))
          PY
