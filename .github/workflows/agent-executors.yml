name: Horizon - 17 especialistas via API

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'agent/**', 'test/**']
    paths: ['horizon_core/**', 'agents/**', '!agents/checkpoints/**', 'tests/**', 'tasks/**', 'sandbox/**', 'benchmarks/**', 'requirements-postgres.txt', 'synthetic_visual/**', '.github/workflows/agent-executors.yml']
  pull_request:
    paths: ['horizon_core/**', 'agents/**', '!agents/checkpoints/**', 'tests/**', 'tasks/**', 'sandbox/**', 'benchmarks/**', 'requirements-postgres.txt', 'synthetic_visual/**', '.github/workflows/agent-executors.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: horizon_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: horizon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U horizon_test -d horizon_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_TEST_DSN: postgresql://horizon_test:synthetic-ci-only@localhost:5432/horizon_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-postgres.txt cryptography==46.0.3
      - name: Validar runtime, 17 identidades e retomada sem chamar API
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar SDK oficial Railway (sem CLI)
        working-directory: sandbox
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testar bridge do SDK
        working-directory: sandbox
        run: node --test bridge.test.mjs postgres_bridge.test.mjs
      - name: Inventariar especialistas
        run: python -m horizon_core.app --list

  visual-proof:
    needs: verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe do navegador isolado
        run: node --check synthetic_visual/browser-proof.cjs
      - name: Preparar Playwright com Chromium no Docker
        run: docker build -t horizon-web-proof:1.58.2 synthetic_visual
      - name: Executar interface real sintética, abrir e fechar mensagens
        run: python -m horizon_core.web_checks --root synthetic_visual/generic-demo --check browser-playwright --evidence runtime/visual-fixture
      - name: Arquivar capturas demonstrativas
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ui-proof
          path: runtime/visual-fixture/
          if-no-files-found: ignore
          retention-days: 3

  configuration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir configuração sem chamar IA e sem revelar credenciais
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          python3 -m horizon_core.discover_models
          python3 -m horizon_core.app --preflight
          python3 -m horizon_core.provider_access_probe

  smoke-prepare:
    needs: verification
    if: >-
      github.event_name == 'push' && github.actor == 'danielnep' &&
      github.repository == 'danielnep/May-Maestro-Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publicar checkpoint sintético por API sem chamar IA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python3 -m horizon_core.smoke prepare --repo danielnep/May-Maestro-Executor --run-id "$RUN_ID"

  smoke-resume:
    needs: smoke-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retomar em outro runner e executar Docker real
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python3 -m horizon_core.smoke resume --repo danielnep/May-Maestro-Executor --run-id "$RUN_ID"

  providers-proof:
    needs: verification
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[providers]'))) &&
      github.actor == 'danielnep' && github.repository == 'danielnep/May-Maestro-Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Provar decisões independentes dos 17 perfis com API real
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          RUN_ID: ${{ github.run_id }}
        run: python3 -m horizon_core.prove providers --repo danielnep/May-Maestro-Executor --run-id "$RUN_ID"

  railway-proof:
    needs: verification
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == 'danielnep' &&
      github.repository == 'danielnep/May-Maestro-Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar SDK oficial Railway
        working-directory: sandbox
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provar criação, reuso e teste isolado em sandbox real
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RUN_ID: ${{ github.run_id }}
        run: python3 -m horizon_core.prove railway --repo danielnep/May-Maestro-Executor --run-id "$RUN_ID"

  worker:
    concurrency:
      group: horizon-durable-worker
      cancel-in-progress: false
    needs: verification
    # User-authorized providers; no inference on pull requests.
    # Legacy inbox is opt-in; chat-requests.yml owns the durable project-scoped queue.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      vars.HORIZON_LEGACY_WORKER_ENABLED == 'true' &&
      github.repository == 'danielnep/May-Maestro-Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.HORIZON_WORK_BRANCH || 'agent/runtime-work' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar SDK oficial Railway
        working-directory: sandbox
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Executar fila com orçamento e proteção anti-loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          HORIZON_STATE_BACKEND: ${{ vars.HORIZON_STATE_BACKEND || 'sqlite' }}
          RAILWAY_STATE_ENVIRONMENT_ID: da638584-8400-44f8-9b93-3c3d343a6022
        run: >-
          python -m horizon_core.app --remote-repo danielnep/May-Maestro-Executor
          --session-seconds 2400
      - name: Publicar arquivos recuperáveis somente na branch de trabalho
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_STATE_ENVIRONMENT_ID: da638584-8400-44f8-9b93-3c3d343a6022
          HORIZON_STATE_BACKEND: ${{ vars.HORIZON_STATE_BACKEND || 'sqlite' }}
        run: python -m horizon_core.publish --repo danielnep/May-Maestro-Executor
      - name: Resumo da execução
        if: always()
        run: |
          if [ -f runtime/report.json ]; then
            cat runtime/report.json
          fi

  complex-benchmark:
    needs: verification
    if: >-
      github.event_name == 'push' && github.actor == 'danielnep' &&
      github.ref == 'refs/heads/feat/horizon-quality-20261018' &&
      contains(github.event.head_commit.message, '[benchmark]') &&
      github.repository == 'danielnep/May-Maestro-Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desafio sintético difícil com reparo por API e avaliação privada
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED || 'true' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python benchmarks/run_live.py --session-seconds 2400
      - name: Evidências sintéticas sem credenciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reservations-v1-${{ github.run_id }}
          path: |
            runtime/benchmark-report.json
            runtime/benchmark-engine.py
            runtime/benchmark-checkpoint.sqlite3

  private-state-proof:
    needs: verification
    if: >-
      github.event_name == 'push' && github.actor == 'danielnep' &&
      vars.HORIZON_STATE_BACKEND == 'railway-postgres' &&
      github.repository == 'danielnep/May-Maestro-Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sandbox
      - name: Confirmar PostgreSQL privado sem copiar senha para runner
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_STATE_ENVIRONMENT_ID: da638584-8400-44f8-9b93-3c3d343a6022
        run: |
          python - <<'PY'
          import json
          from horizon_core.railway_postgres import RailwayPostgresState
          state = RailwayPostgresState()
          first = state.health()
          initial_id = state.sandbox_id
          second = state.health()
          result = state._request(operation='test_pg')
          print(json.dumps({'health':first,'reused':initial_id==state.sandbox_id,'postgres_tests':result}))
          if not result.get('passed') or result.get('tests_run',0)<14:
              raise SystemExit(1)
          state.close()
          PY
