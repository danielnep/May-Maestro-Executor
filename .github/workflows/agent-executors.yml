name: Horizon - 17 especialistas via API

on:
  push:
    branches: ['feat/**', 'fix/**', 'agent/**', 'test/**']
    paths: ['horizon_core/**', 'agents/**', 'tests/**', 'tasks/**', '.github/workflows/agent-executors.yml']
  pull_request:
    paths: ['horizon_core/**', 'agents/**', 'tests/**', 'tasks/**', '.github/workflows/agent-executors.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: horizon-durable-worker
  cancel-in-progress: false

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar runtime, 17 identidades e retomada sem chamar API
        run: python -m unittest discover -s tests -v
      - name: Inventariar especialistas
        run: python -m horizon_core.app --list

  configuration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir configuração sem chamar IA e sem revelar credenciais
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
        run: python3 -m horizon_core.app --preflight

  worker:
    needs: verification
    # No live calls on PRs. Operator must attest a no-billing Google project.
    # Scheduling starts only when this workflow is approved onto the default branch.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      vars.HORIZON_WORKER_ENABLED == 'true' && vars.GEMINI_FREE_TIER_CONFIRMED == 'true' &&
      github.repository == 'danielnep/May-Maestro-Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.HORIZON_WORK_BRANCH || 'feat/horizon-team-runtime-20261018' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar fila persistente com orçamento limitado
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          GEMINI_MAX_CALLS: '12'
          GEMINI_MAX_OUTPUT_TOKENS: '2048'
        run: >-
          python -m horizon_core.app --remote-repo danielnep/May-Maestro-Executor
          --max-tasks 3
      - name: Publicar arquivos recuperáveis somente na branch de trabalho
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m horizon_core.publish --repo danielnep/May-Maestro-Executor
      - name: Resumo da execução
        if: always()
        run: |
          if [ -f runtime/report.json ]; then
            cat runtime/report.json
          fi
