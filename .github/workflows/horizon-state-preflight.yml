name: Horizon - checagem leitura de memoria
on:
  push:
    branches: [main]
    paths: ['.github/workflows/horizon-state-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-existing-state:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Check checkpoint and Railway authentication without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HORIZON_SQLITE_ENCRYPTION_KEY: ${{ secrets.HORIZON_SQLITE_ENCRYPTION_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from horizon_core.github_sqlite_state import GitHubSQLiteState
          print('STATE_SOURCE='+('dedicated' if os.environ.get('HORIZON_SQLITE_ENCRYPTION_KEY') else 'legacy' if os.environ.get('RAILWAY_API_TOKEN') else 'none'))
          try:
              state=GitHubSQLiteState()
              try:
                  ok=state.db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
                  count=state.db.execute('SELECT COUNT(*) FROM tasks').fetchone()[0]
                  print('STATE_VALID='+str(ok).lower())
                  print('TASK_RECORDS='+str(count))
              finally:
                  state.close()
          except Exception:
              print('STATE_VALID=false')
          token=os.environ.get('RAILWAY_API_TOKEN','')
          if not token:
              print('RAILWAY_TOKEN_VALID=false')
          else:
              body=json.dumps({'query':'query ($id:String!){project(id:$id){id}}','variables':{'id':'caf3c2ea-f857-4242-8fa3-5453ea1462ca'}}).encode()
              request=urllib.request.Request('https://backboard.railway.com/graphql/v2',data=body,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(request,timeout=15) as response: data=json.load(response)
                  ok=(data.get('data') or {}).get('project',{}).get('id')=='caf3c2ea-f857-4242-8fa3-5453ea1462ca'
                  print('RAILWAY_TOKEN_VALID='+str(ok).lower())
              except Exception:
                  print('RAILWAY_TOKEN_VALID=false')
          PY
