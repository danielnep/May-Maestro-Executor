<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estação — laboratório de operações</title><link rel="stylesheet" href="styles.css"><script src="model.js" defer></script><script src="app.js" defer></script></head><body>
<a class="skip" href="#main">Ir para conteúdo</a><div class="shell"><aside><p class="brand">estação<span>LABORATÓRIO / 04</span></p><nav aria-label="Áreas de trabalho"><a href="#/queue">Fila</a><a href="#/stock">Estoque</a><a href="#/history">Histórico</a><a href="#/settings">Ajustes</a></nav><p class="aside-note">Ambiente sintético<br>Sem dados de clientes</p></aside><div class="workspace"><header><span>OPERAÇÕES / TURNO 01</span><strong id="connection" role="status">Online</strong></header><main id="main" tabindex="-1"><div class="heading"><div><p class="eyebrow">Visão operacional</p><h1 id="page-title">Fila de reservas</h1></div><button id="new-order">Nova reserva</button></div><div class="statusline"><p><strong id="active-count">0</strong> ativas</p><p><strong id="pending-count">0</strong> pendentes</p><button id="sync">Sincronizar</button></div><p id="sync-error" role="alert" hidden></p><p id="notice" role="status"></p><section id="screen" aria-labelledby="page-title"></section></main><footer>ESTAÇÃO · provas de estado, conexão e interação</footer></div></div>
<dialog id="order-dialog" aria-labelledby="dialog-title"><form id="order-form" novalidate><div class="dialog-top"><h2 id="dialog-title">Nova reserva</h2><button type="button" id="close-dialog" class="quiet" aria-label="Fechar reserva">×</button></div><label for="title">Descrição</label><input id="title" name="title" maxlength="120" autocomplete="off" aria-describedby="form-error"><label for="sku">Equipamento</label><select id="sku" name="sku"><option value="lamp">Lanterna</option><option value="radio">Rádio</option></select><label for="qty">Quantidade</label><input id="qty" name="qty" type="number" min="1" max="99" value="1" aria-describedby="form-error"><p id="form-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="cancel-dialog" class="quiet">Voltar</button><button type="submit">Confirmar reserva</button></div></form></dialog>
</body></html>
