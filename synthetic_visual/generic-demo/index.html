<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual demo fixture</title>
<style>body{font:16px system-ui;background:#191e26;color:#e5edf5;margin:0;padding:24px}main{max-width:780px;margin:auto}.panel{border:1px solid #536273;padding:16px;border-radius:12px}button{padding:12px;background:#1f98ff;border:0;border-radius:8px;color:#fff}dialog{width:min(90vw,680px);height:75dvh;background:#26303d;color:#fff;border:0;border-radius:12px}</style></head>
<body><main><h1>Painel de rondas demonstrativo</h1><section class="panel"><p>Painel pronto, com layout responsivo.</p><button id="messages" onclick="document.getElementById('chat').showModal()">Mensagens</button></section></main>
<dialog id="chat" aria-label="Painel de mensagens"><h2>Central de mensagens</h2><p>Conversa aberta e visível.</p><button onclick="document.getElementById('chat').close()">Fechar mensagens</button></dialog></body></html>
